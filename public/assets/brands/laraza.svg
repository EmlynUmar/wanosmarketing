<svg viewBox="0 0 320 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Crosshatch pattern for letter shading matching authentic artwork -->
    <pattern id="raza_hatch_dark" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#000000" stroke-width="1.2" />
    </pattern>
    <pattern id="raza_hatch_light" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Group for dark background rendering (white text/lines) -->
  <g class="laraza-logo-art" stroke-linecap="round" stroke-linejoin="round">
    <!-- "La" - Top Line -->
    <g transform="translate(90, 20)">
      <!-- 'L' Main Body -->
      <!-- Decorative Top Cap of L -->
      <path d="M 38 12 L 52 4 L 44 26 L 30 20 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
      
      <!-- L Vertical Stem with 3D Bevel & Hatching -->
      <path d="M 30 20 L 44 26 L 42 62 L 24 56 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M 44 26 L 54 32 L 52 68 L 42 62 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
      
      <!-- L Bottom Flourish & Sweeping Tail -->
      <path d="M 24 56 C 24 56 12 50 4 62 C -4 74 2 86 16 88 C 30 90 44 76 56 74 C 68 72 74 76 74 76 L 70 82 C 70 82 62 78 52 80 C 40 82 24 96 12 94 C -2 92 -10 76 -2 60 C 6 44 20 48 24 56 Z" 
            fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
      
      <!-- L Top Right Notch -->
      <path d="M 44 26 L 60 20 L 66 28 L 50 34 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" />
      
      <!-- 'a' of La -->
      <g transform="translate(68, 30)">
        <!-- Top Diamond Roof -->
        <path d="M 18 6 L 30 0 L 36 12 L 24 18 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Left Arch -->
        <path d="M 8 22 L 18 16 L 24 24 L 14 30 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" />
        <path d="M 8 22 L 14 30 L 12 52 L 4 46 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Right Main Stem & Bevel -->
        <path d="M 24 18 L 36 12 L 36 50 L 24 56 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 36 12 L 44 18 L 44 54 L 36 50 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Bottom Loop -->
        <path d="M 4 46 C 4 46 12 56 24 56 L 36 56 L 42 62 L 20 62 C 10 62 0 52 4 46 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Inner Counter -->
        <path d="M 16 32 L 24 28 L 24 44 L 16 46 Z" fill="#090A0F" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>

    <!-- "Raza" - Bottom Line -->
    <g transform="translate(25, 130)">
      <!-- 'R' Letter -->
      <g transform="translate(0, 0)">
        <!-- Top Crown/Spire of R -->
        <path d="M 26 8 L 40 0 L 34 20 L 20 16 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Main Stem with Hatch -->
        <path d="M 20 16 L 34 20 L 32 64 L 18 58 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 34 20 L 42 26 L 40 68 L 32 64 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Upper Right Bowl of R -->
        <path d="M 34 20 C 44 14 62 14 68 26 C 74 38 66 50 48 52 L 32 52 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 68 26 L 76 32 C 76 46 64 56 46 58 L 48 52 C 66 50 74 38 68 26 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Right Diagonal Leg of R -->
        <path d="M 44 48 L 58 48 L 74 88 L 58 88 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 58 48 L 66 52 L 82 92 L 74 88 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Lower Left Whimsical Swash Flourish of R -->
        <path d="M 18 58 C 18 58 6 52 -4 64 C -14 78 -4 94 12 96 C 28 98 42 84 50 82 C 58 80 62 84 62 84 L 58 90 C 58 90 50 86 42 88 C 30 92 14 104 2 100 C -12 96 -20 80 -10 64 C -2 46 14 50 18 58 Z" 
              fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
      </g>

      <!-- First 'a' of Raza -->
      <g transform="translate(86, 20)">
        <!-- Top Diamond Roof -->
        <path d="M 18 6 L 30 0 L 36 12 L 24 18 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Left Arch -->
        <path d="M 8 22 L 18 16 L 24 24 L 14 30 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" />
        <path d="M 8 22 L 14 30 L 12 52 L 4 46 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Right Main Stem & Bevel -->
        <path d="M 24 18 L 36 12 L 36 50 L 24 56 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 36 12 L 44 18 L 44 54 L 36 50 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Bottom Loop -->
        <path d="M 4 46 C 4 46 12 56 24 56 L 36 56 L 42 62 L 20 62 C 10 62 0 52 4 46 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Inner Counter -->
        <path d="M 16 32 L 24 28 L 24 44 L 16 46 Z" fill="#090A0F" stroke="#FFFFFF" stroke-width="2" />
      </g>

      <!-- 'z' of Raza -->
      <g transform="translate(142, 20)">
        <!-- Top Bar of z with Gothic Points -->
        <path d="M 4 8 L 14 2 L 36 2 L 32 14 L 14 14 L 8 20 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Diagonal Center Stroke with Hatching -->
        <path d="M 32 14 L 36 8 L 16 52 L 10 46 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 36 8 L 44 14 L 24 56 L 16 52 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Bottom Swung Tail of z Descending Below Baseline -->
        <path d="M 10 46 L 24 56 C 24 56 34 54 36 64 C 38 76 26 84 14 84 C 4 84 -2 76 4 70 C 8 66 16 68 16 72 C 16 76 10 78 8 76 C 6 74 8 72 10 72 C 14 72 24 74 24 68 C 24 62 16 60 8 58 L 2 50 Z" 
              fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
      </g>

      <!-- Second 'a' of Raza -->
      <g transform="translate(196, 20)">
        <!-- Top Diamond Roof -->
        <path d="M 18 6 L 30 0 L 36 12 L 24 18 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Left Arch -->
        <path d="M 8 22 L 18 16 L 24 24 L 14 30 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" />
        <path d="M 8 22 L 14 30 L 12 52 L 4 46 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Right Main Stem & Bevel -->
        <path d="M 24 18 L 36 12 L 36 50 L 24 56 Z" fill="url(#raza_hatch_light)" stroke="#FFFFFF" stroke-width="2.5" />
        <path d="M 36 12 L 44 18 L 44 54 L 36 50 Z" fill="#FFFFFF" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Bottom Loop -->
        <path d="M 4 46 C 4 46 12 56 24 56 L 36 56 L 42 62 L 20 62 C 10 62 0 52 4 46 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.5" />
        <!-- Inner Counter -->
        <path d="M 16 32 L 24 28 L 24 44 L 16 46 Z" fill="#090A0F" stroke="#FFFFFF" stroke-width="2" />
      </g>
    </g>
  </g>
</svg>
